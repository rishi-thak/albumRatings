<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
        }
        h1 {
            margin: 0;
        }
        .container {
            max-width: 90%;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center; /* Centering content inside the container */
        }
        label, input, button {
            font-size: 1rem;
            margin-bottom: 10px;
            display: block;
            width: 100%;
        }
        input[type="number"] {
            width: 80%; /* Making the input box 80% width */
            padding: 8px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin: 0 auto; /* Centering input */
            display: block;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            width: 80%; /* Centering the button by matching its width with the input */
            margin: 10px auto;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            font-size: 1.2rem;
            margin: 15px 0;
        }

        /* Responsive styles for mobile devices */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }
            .container {
                width: 95%;
                padding: 15px;
            }
            label, input, button {
                font-size: 0.9rem;
            }
            input[type="number"], button {
                width: 90%; /* Increasing the width of the input and button on smaller screens */
            }
        }

        /* Responsive styles for tablets and above */
        @media (min-width: 600px) and (max-width: 1024px) {
            .container {
                width: 80%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Error</h1>
    </header>

    <div class="container">
        <p class="error">{{ error }}</p>
        <a href="/" style="color: #4CAF50; font-size: 1.1rem;">Go back to the form</a>
    </div>

</body>
</html>
