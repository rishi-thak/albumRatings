<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enter Album Details</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        color: #333;
        margin: 0;
        padding: 0;
      }
      .container {
        width: 60%;
        margin: 50px auto;
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #4caf50;
        text-align: center;
        font-size: 2rem;
      }
      .form-group {
        margin-bottom: 15px;
        position: relative;
      }
      label {
        display: block;
        font-size: 1rem;
        margin-bottom: 5px;
        color: #555;
      }
      input[type="text"],
      textarea {
        width: 100%;
        padding: 10px;
        font-size: 1rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
      }
      textarea {
        resize: none;
        height: 100px;
      }
      ul {
        position: absolute;
        background: white;
        border: 1px solid #ddd;
        list-style: none;
        padding: 5px;
        margin: 0;
        width: 100%;
        max-height: 150px;
        overflow-y: auto;
        z-index: 1000;
        display: none; /* Hide by default */
      }
      ul li {
        padding: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
      }
      ul li img {
        width: 30px;
        height: 30px;
        margin-right: 10px;
      }
      ul li:hover {
        background: #ddd;
      }
      button {
        background-color: #0c6fa8;
        color: white;
        font-size: 1rem;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
        margin-top: 20px;
      }
      button:hover {
        background-color: #084681;
      }
      .form-navigation {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
      }
      .form-navigation a {
        text-decoration: none;
        color: #4caf50;
        font-size: 1rem;
        background-color: #0c6fa8;
        color: white;
        padding: 8px 12px;
        border-radius: 4px;
        transition: background-color 0.3s;
      }
      .form-navigation a:hover {
        background-color: #084681;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>
        Enter details for album {{ album_counter + 1 }} of {{ num_albums }}
      </h1>
      <form method="POST" action="{{ url_for('add_album') }}">
        <input type="hidden" name="album_counter" value="{{ album_counter }}" />
        <input type="hidden" name="num_albums" value="{{ num_albums }}" />

        <div class="form-group">
          <label for="title">Title:</label>
          <input
            type="text"
            id="title"
            name="title"
            required
            onkeyup="searchAlbums()"
            onkeydown="checkEnterKey(event)"
          />
          <ul id="suggestions"></ul>
        </div>
        <div class="form-group">
          <label for="artist">Artist:</label>
          <input type="text" id="artist" name="artist" required />
        </div>
        <div class="form-group">
          <label for="genre">Genre:</label>
          <input type="text" id="genre" name="genre" required />
        </div>
        <div class="form-group">
          <label for="rating">Rating (out of 10):</label>
          <input type="text" name="rating" required />
        </div>
        <div class="form-group">
          <label for="just">Reasoning:</label>
          <textarea name="just" required></textarea>
        </div>
        <div class="form-group">
          <label for="rater">Your Name:</label>
          <input type="text" name="rater" required />
        </div>

        <button type="submit">Submit Album</button>
      </form>

      <div class="form-navigation">
        <a href="{{ url_for('index') }}">Go back to Home</a>
      </div>
    </div>

    <script>
      const CLIENT_ID = "50237c828d5c4d8e99e85b62380cf95e"; // Replace with your actual Client ID
      const CLIENT_SECRET = "8cdc64dba43442eead4e3ccbbd8bda4b"; // Replace with your actual Client Secret
      let accessToken = "";

      // Fetch access token to interact with Spotify API
      async function getAccessToken() {
        const response = await fetch("https://accounts.spotify.com/api/token", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            Authorization: "Basic " + btoa(CLIENT_ID + ":" + CLIENT_SECRET),
          },
          body: "grant_type=client_credentials",
        });
        const data = await response.json();
        accessToken = data.access_token;
      }

      // Search for albums in Spotify API
      async function searchAlbums() {
        let query = document.getElementById("title").value;
        const suggestionsList = document.getElementById("suggestions");

        if (query.length < 2) {
          suggestionsList.style.display = "none"; // Hide suggestions box if query is short
          return;
        }

        const response = await fetch(
          `https://api.spotify.com/v1/search?q=${encodeURIComponent(
            query
          )}&type=album&limit=5`,
          {
            headers: { Authorization: "Bearer " + accessToken },
          }
        );
        const data = await response.json();

        if (data.albums.items.length === 0) {
          suggestionsList.style.display = "none"; // Hide suggestions if no results
          return;
        }

        displaySuggestions(data.albums.items);
      }

      // Display suggestions in dropdown list with album covers
      function displaySuggestions(albums) {
        const suggestionsList = document.getElementById("suggestions");
        suggestionsList.innerHTML = "";
        suggestionsList.style.display = "block"; // Show suggestions box

        albums.forEach((album) => {
          let li = document.createElement("li");

          // Create an image element for the album cover
          let img = document.createElement("img");
          img.src = album.images[0]?.url || "https://via.placeholder.com/30"; // Default placeholder image if no cover
          img.alt = album.name;

          li.appendChild(img); // Add the image to the list item
          li.appendChild(
            document.createTextNode(album.name + " - " + album.artists[0].name)
          ); // Add album name and artist

          li.onclick = () => selectAlbum(album); // Bind click event to autofill
          suggestionsList.appendChild(li);
        });
      }

      // Autofill fields when an album is selected
      function selectAlbum(album) {
        document.getElementById("title").value = album.name;
        document.getElementById("artist").value = album.artists[0].name;

        // Fetch genre data from the artist's profile
        fetch(`https://api.spotify.com/v1/artists/${album.artists[0].id}`, {
          headers: { Authorization: "Bearer " + accessToken },
        })
          .then((response) => response.json())
          .then((data) => {
            document.getElementById("genre").value =
              data.genres.length > 0 ? data.genres.join(", ") : "Unknown";
          });

        document.getElementById("suggestions").innerHTML = ""; // Clear suggestions
        document.getElementById("suggestions").style.display = "none"; // Hide the suggestions box
      }

      // Hide the suggestions box when Enter is pressed (if no suggestion is selected)
      function checkEnterKey(event) {
        if (event.key === "Enter") {
          document.getElementById("suggestions").style.display = "none"; // Hide suggestions box on enter
        }
      }

      // Call getAccessToken when the page loads
      getAccessToken();
    </script>
  </body>
</html>
